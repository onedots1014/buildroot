image bootfs.ext4 {
    vfat {
        files = {
            "stm32mp157c-onedots-512d-v1.dtb",
            "boot.scr.uimg",
            "uImage",
			"mmc1_extlinux",
			"mmc0_extlinux",
            "uInitrd",
            "splash.bmp",
        }
    }
    size = 32M
}

image onedots-stm32mp157-512d-v1-tfa.img {
	hdimage {
		partition-table-type = "gpt"
	}

	partition fsbl1 {
		image = "tf-a-onedots_stm32mp157c-512d-v1.stm32"
		size = 2M
	}

	partition fsbl2 {
		image = "tf-a-onedots_stm32mp157c-512d-v1.stm32"
		size = 2M
	}

	partition ssbl {
		image = "u-boot.stm32"
		size = 4M
	}
	partition rootfs {
		image = "rootfs.ext4"
		bootable = "yes"
		size = 1500M
	}
	partition userdata {
		bootable = "yes"
		size = 500M

	}
}
